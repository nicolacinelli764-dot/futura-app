<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FUTURA 0.1</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;background:#090910;color:#fff}.wrap{max-width:720px;margin:auto;padding:28px 18px}.logo{font-size:28px;font-weight:800}.muted{color:#aaaabb}.card{background:#151521;border:1px solid #29293a;border-radius:22px;padding:22px;margin-top:18px}h1{font-size:38px;line-height:1.05}input{width:100%;padding:16px;border-radius:14px;border:1px solid #3a3a4a;background:#0f0f17;color:white;font-size:16px}button{width:100%;padding:15px;border:0;border-radius:14px;margin-top:12px;font-weight:800;cursor:pointer}.hidden{display:none}.bar{height:10px;background:#303040;border-radius:20px;overflow:hidden}.fill{height:100%;width:0;background:white;transition:.3s}.task{padding:14px 0;border-bottom:1px solid #29293a}.task:last-child{border:0}.task label{display:flex;gap:10px}.task input{width:20px}</style></head><body><main class="wrap"><div class="logo">FUTURA</div><div class="muted">Trasforma un obiettivo in un percorso.</div><section id="home" class="card"><h1>Qual è il tuo obiettivo?</h1><p class="muted">Scrivilo e crea il tuo primo piano operativo.</p><input id="goal" placeholder="Es. Voglio guadagnare 2.000€ al mese"><button onclick="start()">CREA IL MIO PIANO →</button></section><section id="app" class="hidden"><div class="card"><div class="muted">OBIETTIVO</div><h2 id="out"></h2><div class="muted">PROGRESSO</div><div class="bar"><div class="fill" id="fill"></div></div><p id="pct" class="muted">0%</p></div><div class="card"><h2>🔥 Oggi</h2><p class="muted">Fai queste azioni e costruisci il tuo percorso.</p><div id="tasks"></div></div><button onclick="location.reload()">NUOVO OBIETTIVO</button></section></main><script>const steps=['Definisci il risultato esatto che vuoi ottenere.','Dedica 30 minuti alla ricerca di una soluzione concreta.','Scrivi il primo passo che puoi completare oggi.','Fai una prima azione reale.','Controlla il risultato e correggi il piano.'];function start(){let g=document.getElementById('goal').value.trim();if(!g)return;document.getElementById('out').textContent=g;document.getElementById('home').classList.add('hidden');document.getElementById('app').classList.remove('hidden');let box=document.getElementById('tasks');steps.forEach((s,i)=>{box.innerHTML+=`<div class="task"><label><input type="checkbox" onchange="progress()"><span>${s}</span></label></div>`})}function progress(){let a=[...document.querySelectorAll('.task input')],n=a.filter(x=>x.checked).length,p=Math.round(n/a.length*100);document.getElementById('fill').style.width=p+'%';document.getElementById('pct').textContent=p+'% completato'}</script></body></html>
